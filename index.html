<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>रफ़्तार AI</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>

html,
body{
    margin:0;
    padding:0;
    background:#020617;
    overflow:hidden;
    font-family:sans-serif;
}

/* ===== SCROLLBAR ===== */

::-webkit-scrollbar{
    width:6px;
}

::-webkit-scrollbar-thumb{
    background:#334155;
    border-radius:10px;
}

/* ===== GRID ===== */

.bg-grid{

    background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);

    background-size:40px 40px;
}

/* ===== MESSAGE ===== */

.msg{
    animation:msg .25s ease;
}

@keyframes msg{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ===== TYPING ===== */

.typing-dot{
    animation:typing 1.4s infinite ease-in-out both;
}

.typing-dot:nth-child(1){
    animation-delay:-0.32s;
}

.typing-dot:nth-child(2){
    animation-delay:-0.16s;
}

@keyframes typing{

    0%,80%,100%{
        transform:scale(0);
        opacity:.5;
    }

    40%{
        transform:scale(1);
        opacity:1;
    }
}

textarea{
    max-height:180px;
}

.glass{
    backdrop-filter:blur(12px);
    background:rgba(15,23,42,.65);
}

</style>

</head>

<body class="text-white">

<!-- ====================================================== -->
<!-- BG -->
<!-- ====================================================== -->

<div class="fixed inset-0 bg-grid"></div>

<!-- ====================================================== -->
<!-- APP -->
<!-- ====================================================== -->

<div class="relative h-screen max-w-5xl mx-auto border-x border-slate-800 flex flex-col">

    <!-- ====================================================== -->
    <!-- HEADER -->
    <!-- ====================================================== -->

    <header class="glass border-b border-slate-800 p-4 z-10">

        <div class="flex items-center justify-between">

            <div class="flex items-center gap-3">

                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-cyan-500 to-blue-700 flex items-center justify-center shadow-lg shadow-cyan-500/30">

                    <i data-lucide="brain-circuit"
                       class="w-6 h-6"></i>

                </div>

                <div>

                    <h1 class="font-bold text-lg">

                        रफ़्तार AI

                    </h1>

                    <p class="text-xs text-slate-400">

                        Local Offline AI • Browser Based

                    </p>

                </div>

            </div>

            <div id="statusBadge"
                 class="px-3 py-1 rounded-full text-xs bg-amber-500/20 border border-amber-500/30 text-amber-300">

                Loading Model...

            </div>

        </div>

    </header>

    <!-- ====================================================== -->
    <!-- CHAT -->
    <!-- ====================================================== -->

    <main id="chatContainer"
          class="flex-1 overflow-y-auto p-4 space-y-5">

        <div class="flex justify-start msg">

            <div class="max-w-[85%] bg-slate-800 border border-slate-700 rounded-2xl rounded-tl-none p-4">

                <p class="leading-relaxed">

                    नमस्ते 👋<br><br>

                    मैं <b>रफ़्तार AI</b> हूँ।<br>

                    मैं तुम्हारे डिवाइस पर ही चलता हूँ 🔥

                </p>

                <div class="mt-4 text-cyan-300 text-sm">

                    Features:
                    <br>
                    • Offline AI
                    <br>
                    • Browser Cache
                    <br>
                    • Voice Input
                    <br>
                    • Chat Memory
                    <br>
                    • Mobile Friendly

                </div>

            </div>

        </div>

    </main>

    <!-- ====================================================== -->
    <!-- TYPING -->
    <!-- ====================================================== -->

    <div id="typingIndicator"
         class="hidden px-4 pb-4">

        <div class="flex justify-start">

            <div class="bg-slate-800 border border-slate-700 rounded-2xl rounded-tl-none px-4 py-3 flex gap-1">

                <div class="w-2 h-2 bg-cyan-400 rounded-full typing-dot"></div>

                <div class="w-2 h-2 bg-cyan-400 rounded-full typing-dot"></div>

                <div class="w-2 h-2 bg-cyan-400 rounded-full typing-dot"></div>

            </div>

        </div>

    </div>

    <!-- ====================================================== -->
    <!-- INPUT -->
    <!-- ====================================================== -->

    <footer class="glass border-t border-slate-800 p-4">

        <form id="chatForm"
              class="flex items-end gap-3">

            <!-- Voice -->

            <button type="button"
                    id="voiceBtn"
                    class="w-12 h-12 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center hover:bg-slate-700 transition shrink-0">

                <i data-lucide="mic"
                   class="w-5 h-5"></i>

            </button>

            <!-- Input -->

            <textarea
                id="userInput"
                rows="1"
                placeholder="कुछ भी पूछो..."
                disabled
                class="flex-1 bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 resize-none outline-none focus:border-cyan-500 transition"
            ></textarea>

            <!-- Send -->

            <button
                type="submit"
                id="sendBtn"
                disabled
                class="w-14 h-14 rounded-2xl bg-cyan-600 hover:bg-cyan-500 disabled:bg-slate-700 flex items-center justify-center transition shrink-0">

                <i data-lucide="send"
                   class="w-5 h-5"></i>

            </button>

        </form>

    </footer>

</div>

<!-- ====================================================== -->
<!-- LOADING -->
<!-- ====================================================== -->

<div id="loadingScreen"
     class="fixed inset-0 bg-slate-950/95 z-50 flex items-center justify-center p-5">

    <div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-3xl p-8 text-center">

        <div class="relative w-24 h-24 mx-auto mb-6">

            <div class="absolute inset-0 rounded-full border-4 border-cyan-500/20"></div>

            <div class="absolute inset-0 rounded-full border-4 border-cyan-500 border-t-transparent animate-spin"></div>

            <i data-lucide="cpu"
               class="absolute w-10 h-10 text-cyan-400 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></i>

        </div>

        <h2 class="text-xl font-bold mb-3">

            AI डाउनलोड हो रहा है...

        </h2>

        <p class="text-sm text-slate-400 mb-6">

            पहली बार थोड़ा समय लगेगा 😄

        </p>

        <div class="space-y-2">

            <div class="flex justify-between text-xs">

                <span id="downloadFile">

                    तैयारी हो रही है...

                </span>

                <span id="downloadPercent">

                    0%

                </span>

            </div>

            <div class="h-3 bg-slate-800 rounded-full overflow-hidden">

                <div id="progressBar"
                     class="h-full w-0 bg-gradient-to-r from-cyan-500 to-blue-600 transition-all duration-300"></div>

            </div>

        </div>

    </div>

</div>

<!-- ====================================================== -->
<!-- SCRIPT -->
<!-- ====================================================== -->

<script type="module">

import {
    pipeline,
    env
}
from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

// ======================================================
// CONFIG
// ======================================================

env.allowLocalModels = false;
env.useBrowserCache = true;
env.useFSCache = false;

env.backends.onnx.wasm.numThreads = 1;

// ======================================================
// ELEMENTS
// ======================================================

const chatContainer =
    document.getElementById('chatContainer');

const chatForm =
    document.getElementById('chatForm');

const userInput =
    document.getElementById('userInput');

const sendBtn =
    document.getElementById('sendBtn');

const typingIndicator =
    document.getElementById('typingIndicator');

const loadingScreen =
    document.getElementById('loadingScreen');

const progressBar =
    document.getElementById('progressBar');

const downloadPercent =
    document.getElementById('downloadPercent');

const downloadFile =
    document.getElementById('downloadFile');

const voiceBtn =
    document.getElementById('voiceBtn');

const statusBadge =
    document.getElementById('statusBadge');

// ======================================================
// MODEL
// ======================================================

let generator = null;

// ======================================================
// SAFE HTML
// ======================================================

function escapeHTML(str){

    return str.replace(/[&<>"']/g,m=>({

        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'

    })[m]);
}

// ======================================================
// CHAT MESSAGE
// ======================================================

function appendMessage(sender,text){

    const wrapper =
        document.createElement('div');

    wrapper.className =
        `flex ${sender === 'user'
            ? 'justify-end'
            : 'justify-start'} msg`;

    const bubble =
        document.createElement('div');

    bubble.className =
        sender === 'user'
        ?
        'max-w-[85%] bg-cyan-700 text-white rounded-2xl rounded-tr-none p-4 whitespace-pre-wrap'
        :
        'max-w-[85%] bg-slate-800 border border-slate-700 text-slate-200 rounded-2xl rounded-tl-none p-4 whitespace-pre-wrap';

    bubble.innerHTML =
        escapeHTML(text);

    wrapper.appendChild(bubble);

    chatContainer.appendChild(wrapper);

    chatContainer.scrollTop =
        chatContainer.scrollHeight;
}

// ======================================================
// TYPE EFFECT
// ======================================================

async function typeMessage(text){

    const wrapper =
        document.createElement('div');

    wrapper.className =
        'flex justify-start msg';

    const bubble =
        document.createElement('div');

    bubble.className =
        'max-w-[85%] bg-slate-800 border border-slate-700 text-slate-200 rounded-2xl rounded-tl-none p-4 whitespace-pre-wrap';

    wrapper.appendChild(bubble);

    chatContainer.appendChild(wrapper);

    let current = '';

    for(let char of text){

        current += char;

        bubble.textContent = current;

        chatContainer.scrollTop =
            chatContainer.scrollHeight;

        await new Promise(r =>
            setTimeout(r,8)
        );
    }
}

// ======================================================
// LOAD MODEL
// ======================================================

async function loadModel(){

    try{

        // Cache detect

        if(localStorage.getItem('raftar-model')){

            downloadFile.innerText =
                'Cached Model Found ⚡';
        }

        generator = await pipeline(

            'text2text-generation',

            'Xenova/flan-t5-small',

            {

                quantized:true,

                progress_callback:data=>{

                    if(data.progress){

                        const percent =
                            Math.round(data.progress);

                        progressBar.style.width =
                            percent + '%';

                        downloadPercent.innerText =
                            percent + '%';
                    }

                    if(data.file){

                        downloadFile.innerText =
                            data.file;
                    }
                }
            }
        );

        localStorage.setItem(
            'raftar-model',
            'loaded'
        );

        statusBadge.innerText =
            'Model Ready';

        statusBadge.className =
            'px-3 py-1 rounded-full text-xs bg-green-500/20 border border-green-500/30 text-green-300';

        loadingScreen.style.opacity = '0';

        setTimeout(()=>{

            loadingScreen.remove();

        },500);

        userInput.disabled = false;

        userInput.focus();

    }

    catch(err){

        console.error(err);

        statusBadge.innerText =
            'Load Failed';

        statusBadge.className =
            'px-3 py-1 rounded-full text-xs bg-red-500/20 border border-red-500/30 text-red-300';

        downloadFile.innerText =
            'डाउनलोड फेल 😢';

        downloadPercent.innerText =
            'Internet Check करो';
    }
}

// ======================================================
// AUTO RESIZE
// ======================================================

userInput.addEventListener('input',()=>{

    userInput.style.height =
        'auto';

    userInput.style.height =
        userInput.scrollHeight + 'px';

    sendBtn.disabled =
        !userInput.value.trim();
});

// ======================================================
// ENTER SEND
// ======================================================

userInput.addEventListener('keydown',e=>{

    if(e.key === 'Enter' && !e.shiftKey){

        e.preventDefault();

        if(!sendBtn.disabled){

            chatForm.dispatchEvent(
                new Event('submit')
            );
        }
    }
});

// ======================================================
// CHAT
// ======================================================

chatForm.addEventListener('submit',async e=>{

    e.preventDefault();

    const text =
        userInput.value.trim();

    if(!text || !generator)
        return;

    appendMessage(
        'user',
        text
    );

    userInput.value = '';

    userInput.style.height = 'auto';

    userInput.disabled = true;

    sendBtn.disabled = true;

    typingIndicator.classList.remove(
        'hidden'
    );

    try{

        const result =
            await generator(text,{

                max_new_tokens:80,

                temperature:.7
            });

        typingIndicator.classList.add(
            'hidden'
        );

        let reply =
            result[0].generated_text.trim();

        // Empty reply protection

        if(!reply){

            reply =
                'मुझे जवाब सोचने में दिक्कत हो रही है 😅';
        }

        await typeMessage(reply);

        // Voice speak

        speak(reply);

    }

    catch(err){

        console.error(err);

        typingIndicator.classList.add(
            'hidden'
        );

        appendMessage(
            'bot',
            'AI जवाब देते समय क्रैश हो गया 😢'
        );
    }

    finally{

        userInput.disabled = false;

        userInput.focus();
    }
});

// ======================================================
// VOICE INPUT
// ======================================================

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if(SpeechRecognition){

    const recognition =
        new SpeechRecognition();

    recognition.lang = 'hi-IN';

    recognition.continuous = false;

    recognition.interimResults = false;

    voiceBtn.addEventListener('click',()=>{

        recognition.start();

        voiceBtn.classList.add(
            'bg-cyan-600'
        );
    });

    recognition.onresult = e => {

        userInput.value =
            e.results[0][0].transcript;

        userInput.dispatchEvent(
            new Event('input')
        );
    };

    recognition.onend = ()=>{

        voiceBtn.classList.remove(
            'bg-cyan-600'
        );
    };
}

// ======================================================
// SPEAK
// ======================================================

function speak(text){

    if(!window.speechSynthesis)
        return;

    const utter =
        new SpeechSynthesisUtterance(text);

    utter.lang = 'hi-IN';

    speechSynthesis.speak(utter);
}

// ======================================================
// START
// ======================================================

lucide.createIcons();

window.onload = ()=>{

    loadModel();
};

</script>

</body>
</html>
